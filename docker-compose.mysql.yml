# Opción B — MySQL 8 en Docker (deja de usar MySQL de XAMPP)
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up --build -d --scale backend=3 --scale frontend=2
#
# Antes: exportar la BD de XAMPP y restaurarla en el contenedor (ver DOCKER_K8S_PLAN.md).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rnpn2026}
      MYSQL_DATABASE: rnpn_vehiculos_nueva
      MYSQL_USER: rnpn_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-rnpn2026}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rnpn-net

  backend:
    environment:
      DATABASE_URL: mysql://rnpn_user:${DB_PASSWORD:-rnpn2026}@mysql:3306/rnpn_vehiculos_nueva
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
