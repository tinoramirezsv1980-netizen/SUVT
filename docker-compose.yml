# RNPN Trazabilidad — Docker Compose (Windows 11)
# Una sola SPA React. Un solo backend. Un solo MySQL.
#
# Opción A (XAMPP):  docker compose up --build -d --scale backend=3 --scale frontend=2
# Opción B (MySQL en Docker): ver docker-compose.mysql.yml
#
# Puerto 8080 para no chocar con Apache de XAMPP (puerto 80).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:-mysql://root:@host.docker.internal:3306/rnpn_vehiculos_nueva}
      JWT_SECRET: ${JWT_SECRET:-cambiar_jwt_en_produccion_minimo_64_caracteres}
      JWT_EXPIRES_IN: "8h"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-RNPN Vehiculos <notificaciones@rnpn.gob.sv>}
      EMAIL_SUPERVISORES: ${EMAIL_SUPERVISORES:-supervisor@rnpn.gob.sv}
      EMAIL_ADMINS: ${EMAIL_ADMINS:-admin@rnpn.gob.sv}
      UMBRAL_KM_MANTENIMIENTO: "50000"
      LOG_LEVEL: info
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - uploads-data:/app/uploads
    networks:
      - rnpn-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    networks:
      - rnpn-net
    depends_on:
      backend:
        condition: service_healthy

  lb:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - rnpn-net

networks:
  rnpn-net:
    driver: bridge

volumes:
  uploads-data:
